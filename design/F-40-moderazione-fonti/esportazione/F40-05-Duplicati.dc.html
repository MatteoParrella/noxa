<body>
<x-dc>
<helmet>

<style>
body{margin:0}
</style>
</helmet>
<div class="nx nx-scuro" style="width: 5368px; height: 2006px; padding: 64px; display: flex; flex-direction: column; gap: 40px; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 8px; max-width: 1100px">
    <span class="etichetta">F-40 · Moderazione · 05</span>
    <h1 class="t-titolo-1" style="margin: 0">Duplicati</h1>
    <p class="c-2" style="margin: 0">Coda con punteggio 0–100 e confronto affiancato: ogni differenza è segnata anche a parole. Unire tiene l’età più alta e i riferimenti all’alcol se una fonte li ha. Tasti S, D e frecce.</p>
  </header>
  <sc-for list="{{righe}}" as="r" hint-placeholder-count="2">
    <div style="display: flex; gap: 40px">
      <sc-for list="{{r.celle}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 12px; width: 1280px; flex: none">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><span style="font-weight: 700">{{c.nome}}</span><span class="t-mono-dato c-2">{{c.tema}} · {{c.tag}}</span></div>
          <div style="width: 1280px; height: 800px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--colore-linea)">
            <dc-import name="Mod" tema="{{c.tema}}" schermata="{{c.s}}" stato="{{c.st}}" larghezza="{{ 1280 }}" altezza="{{ 800 }}" hint-size="1280px,800px"></dc-import>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
