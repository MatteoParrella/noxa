<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Noxa · F-01 · Verifica a 360 px</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/6fa6353d716b68f787ff2702a9363d96">
<link rel="stylesheet" href="/_blob/afc4088ee394ab1a58e9ba7651ca762e">
<link rel="stylesheet" href="/_blob/dbab4423ee519d83500f0485a4806ddb">
<link rel="stylesheet" href="/_blob/cdf778b603b9eec9b9e8c7c0cba7983e">
<link rel="stylesheet" href="/_blob/75de66852ef3f7538a23c938780b4826">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nx nx-scuro" style="width: 2460px; height: 1140px; padding: 64px; display: flex; flex-direction: column; gap: 32px; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 8px">
    <span class="etichetta">F-01 · Scopri · 07</span>
    <h1 class="t-titolo-1" style="margin: 0">Verifica a 360 × 800</h1>
  </header>
  <div style="display: flex; gap: 32px">
    <sc-for list="{{colonne}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 12px; width: 360px; flex: none">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><span style="font-weight: 700">{{c.nome}}</span><span class="t-mono-dato c-2">{{c.tema}} · 360</span></div>
        <div style="width: 360px; height: 800px; border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--colore-linea)">
          <dc-import name="F01" tema="{{c.tema}}" schermata="{{c.s}}" stato="{{c.st}}" giorno="stasera" evento="{{c.ev}}" copertina="auto" partecipazione="{{c.part}}" visibilita="amici" larghezza="{{ 360 }}" altezza="{{ 800 }}" hint-size="360px,800px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2460,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      colonne: [
        { nome: 'Elenco', tema: 'scuro', s: 'elenco', st: 'normale', ev: 'e1', part: 'nessuno' },
        { nome: 'Filtri', tema: 'chiaro', s: 'filtri', st: 'normale', ev: 'e1', part: 'nessuno' },
        { nome: 'Mappa · 2 eventi', tema: 'scuro', s: 'mappa', st: 'multi', ev: 'e1', part: 'nessuno' },
        { nome: 'Dettaglio', tema: 'scuro', s: 'dettaglio', st: 'normale', ev: 'e1', part: 'partecipo' },
        { nome: 'Età non dichiarata', tema: 'chiaro', s: 'dettaglio', st: 'normale', ev: 'e3', part: 'nessuno' },
        { nome: 'Annullato', tema: 'scuro', s: 'dettaglio', st: 'annullato', ev: 'e4', part: 'nessuno' }
      ]
    };
  }
}
</script>
</body>
</html>
