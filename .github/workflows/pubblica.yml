# Pubblicazione su staging e produzione (ADR-0021, ARCHITECTURE.md §6). Parte dopo ogni CI
# verde su main, oppure a mano scegliendo l'ambiente. Per ogni ambiente: migrazioni e Edge
# Functions su Supabase, poi l'export statico dell'app su Cloudflare Pages.
# Dopo la CI gira solo con SERVIZI_ATTIVI=true; gli ambienti sono quelli di AMBIENTI_SERVIZI (JSON, per
# esempio ["staging"]). Segreti e variabili stanno negli environment di GitHub, limitati a main;
# nessun valore segreto entra nella build dell'app (solo NEXT_PUBLIC_*, CLAUDE.md).
name: Pubblicazione

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente da pubblicare
        type: choice
        options: [staging, produzione]
        default: staging

permissions:
  contents: read

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  ambienti:
    name: Ambienti
    # A mano parte sempre (serve alla prima configurazione, con i servizi ancora spenti); dopo la
    # CI solo con SERVIZI_ATTIVI=true.
    if: >-
      github.event_name == 'workflow_dispatch' || (vars.SERVIZI_ATTIVI == 'true' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      elenco: ${{ steps.elenco.outputs.elenco }}
    steps:
      - id: elenco
        env:
          SCELTO: ${{ inputs.ambiente }}
          CONFIGURATI: ${{ vars.AMBIENTI_SERVIZI || '["staging"]' }}
        run: |
          if [[ -n "$SCELTO" ]]; then elenco="[\"$SCELTO\"]"; else elenco="$CONFIGURATI"; fi
          echo "elenco=$(jq -c . <<<"$elenco")" >> "$GITHUB_OUTPUT"

  supabase:
    name: Supabase (${{ matrix.ambiente }})
    needs: ambienti
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        ambiente: ${{ fromJSON(needs.ambienti.outputs.elenco) }}
    environment: ${{ matrix.ambiente }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROGETTO: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "$PROGETTO"
      # Solo migrazioni: il seed con gli utenti di test non va mai fuori dal locale.
      - run: pnpm exec supabase db push --yes
      # verify_jwt di ogni funzione viene da config.toml (invia-push senza JWT, ADR-0026).
      - run: pnpm exec supabase functions deploy --use-api --project-ref "$PROGETTO"

  app:
    name: App su Cloudflare Pages (${{ matrix.ambiente }})
    needs: [ambienti, supabase]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        ambiente: ${{ fromJSON(needs.ambienti.outputs.elenco) }}
    environment: ${{ matrix.ambiente }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPPA_PMTILES_URL: ${{ vars.NEXT_PUBLIC_MAPPA_PMTILES_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_URL_APP: ${{ vars.NEXT_PUBLIC_URL_APP }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: pnpm --filter web build
      # Il catalogo dei componenti non entra mai in una build pubblicata (DESIGN.md §3).
      - run: test ! -e apps/web/out/catalogo
      - name: Caricamento
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROGETTO_PAGES: ${{ vars.CLOUDFLARE_PAGES_PROGETTO }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          pnpm exec wrangler pages deploy apps/web/out --project-name "$PROGETTO_PAGES"
          --branch main --commit-hash "$COMMIT" --commit-dirty=false
