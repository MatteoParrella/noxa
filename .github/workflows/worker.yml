# Worker in modalità a esaurimento (ADR-0021): ogni 15 minuti esegue i job pronti in coda_job e
# termina. pg_cron resta l'unico scheduler: questo workflow sveglia solo l'esecutore.
# Gira per ogni ambiente di AMBIENTI_SERVIZI (JSON, predefinito ["staging"]); i segreti stanno
# negli environment di GitHub, limitati al branch main. I log sono pubblici e il worker non vi
# scrive dati personali.
name: Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esaurisci:
    name: Coda dei job (${{ matrix.ambiente }})
    # Finché la variabile del repository SERVIZI_ATTIVI non vale 'true' (nessun Supabase o R2 online,
    # quindi nessun segreto) il job viene saltato invece di fallire.
    if: github.ref == 'refs/heads/main' && vars.SERVIZI_ATTIVI == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ambiente: ${{ fromJSON(vars.AMBIENTI_SERVIZI || '["staging"]') }}
    environment: ${{ matrix.ambiente }}
    # Una sola esecuzione alla volta per ambiente: la successiva aspetta.
    concurrency:
      group: worker-${{ matrix.ambiente }}
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Immagine del worker
        run: docker build --tag noxa-worker services/worker
      - name: Esecuzione a esaurimento
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SENTRY_DSN_WORKER: ${{ secrets.SENTRY_DSN_WORKER }}
          AMBIENTE: ${{ matrix.ambiente }}
        run: |
          docker run --rm \
            -e AMBIENTE -e LOG_FORMATO=json \
            -e WORKER_DATABASE_URL -e SUPABASE_URL -e SUPABASE_SERVICE_ROLE_KEY \
            -e ANTHROPIC_API_KEY -e META_IG_USER_ID -e META_ACCESS_TOKEN \
            -e GOOGLE_PLACES_API_KEY -e SENTRY_DSN_WORKER \
            noxa-worker uv run --no-sync python -m noxa_worker.esaurisci --durata-massima 600
