# Aggiornamento trimestrale della basemap di Milano e Brianza su Cloudflare R2 (ADR-0016,
# ADR-0021). Usa le chiavi R2 dei segreti di GitHub, mai disponibili all'app.
name: Aggiornamento mappa

on:
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente da aggiornare
        type: choice
        options: [staging, produzione]
        default: staging

permissions:
  contents: read

jobs:
  mappa:
    name: Mappa (${{ inputs.ambiente || 'staging' }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.ambiente || 'staging' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: CLI pmtiles
        run: |
          curl --fail --silent --show-error --location -o pmtiles.tgz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tgz pmtiles && sudo mv pmtiles /usr/local/bin/
      - name: Estrazione e caricamento
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_MAPPE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_MAPPE_SECRET_ACCESS_KEY }}
          R2_BUCKET_MAPPE: ${{ vars.R2_BUCKET_MAPPE }}
        run: scripts/prepara_mappa.sh
