# Aggiornamento trimestrale della basemap di Milano e Brianza nel bucket `mappe` (ADR-0016).
# Usa la chiave service_role dei segreti di GitHub, mai disponibile all'app.
name: Aggiornamento mappa

on:
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente da aggiornare
        type: choice
        options: [staging, produzione]
        default: staging

permissions:
  contents: read

jobs:
  mappa:
    name: Mappa (${{ inputs.ambiente || 'staging' }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.ambiente || 'staging' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: CLI pmtiles
        run: |
          curl --fail --silent --show-error --location -o pmtiles.tgz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tgz pmtiles && sudo mv pmtiles /usr/local/bin/
      - name: Estrazione e caricamento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: scripts/prepara_mappa.sh
