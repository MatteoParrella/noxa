# Solo aggiornamenti di sicurezza: con il limite a zero Dependabot non apre le PR settimanali
# di versione (che restavano in sospeso), ma continua ad aprire quelle che correggono una
# vulnerabilità nota. Gli aggiornamenti di versione si fanno a mano, un ecosistema alla volta,
# quando serve (per esempio dopo un avviso di pnpm audit o pip-audit in CI).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: uv
    directory: /services/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /services/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
