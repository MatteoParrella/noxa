[project]
name = "noxa-worker"
version = "0.1.0"
description = "Worker di Noxa: raccolta eventi, estrazione dei flyer, deduplicazione (ADR-0003)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "playwright==1.64.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "rapidfuzz==3.14.6",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
    "anthropic==1.17.0",
    "pillow==13.0.0",
    "sentry-sdk==2.72.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noxa_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF",
    "ASYNC", "S", "PT", "RET", "PTH", "TID", "ANN", "BLE", "TRY",
]
# N818: le eccezioni seguono la convenzione italiana "Errore…" (ADR-0010).
ignore = ["RUF001", "RUF002", "RUF003", "TRY003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
# valuta.py è uno strumento CLI interattivo: usa print() per output all'utente.
"src/noxa_worker/flyer/valuta.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["noxa_worker"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
