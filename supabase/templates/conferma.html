<!doctype html>
<html lang="it">
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #14171c">
    <h1 style="font-size: 22px">Conferma la tua email</h1>
    <p>Ciao! Per finire di creare il tuo account Noxa apri questo link. Vale per un'ora.</p>
    <p>
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email">Conferma l'email</a>
    </p>
    <p>Se non hai chiesto tu di creare un account, ignora questa email: senza conferma l'account
      non si attiva.</p>
  </body>
</html>
