<!doctype html>
<html lang="it">
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #14171c">
    <h1 style="font-size: 22px">Scegli una nuova password</h1>
    <p>Hai chiesto di reimpostare la password del tuo account Noxa. Apri questo link per
      sceglierne una nuova. Vale per un'ora.</p>
    <p>
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery">Scegli una nuova password</a>
    </p>
    <p>Se non l'hai chiesto tu, ignora questa email: la tua password non cambia.</p>
  </body>
</html>
